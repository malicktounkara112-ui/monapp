<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>La modification d'un article</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<h1>Modifier l'article</h1>
<form th:action="@{/articles/edit/{id}(id=${article.id})}" method="post">
    <input type="text" name="title" th:value="${article.title}" /><br/>
    <input type="text" name="content" th:value="${article.content}" /><br/>
    <button type="submit">Enregistrer</button>
</form>
<a href="/articles" class="btn btn-secondary mt-3">Retour à la liste</a>

</body>
</html>
