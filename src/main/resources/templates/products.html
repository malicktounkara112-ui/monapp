<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des produits</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="~{navbar :: navbar}"></div>
<h1 class="mb-4">Liste des produits</h1>

<h2>Ajouter un produit</h2>
<form action="/products/add" method="post" class="mb-4">
    <div class="mb-2">
        <input type="text" name="name" placeholder="Nom du produit" required class="form-control"/>
    </div>
    <div class="mb-2">
        <input type="number" name="price" placeholder="Prix" step="0.01" required class="form-control"/>
    </div>
    <div class="mb-2">
        <input type="text" name="description" placeholder="Description" class="form-control"/>
    </div>
    <button type="submit" class="btn btn-primary">Ajouter</button>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Nom</th>
        <th>Prix</th>
        <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="product : ${products}">
        <td th:text="${product.id}"></td>
        <td th:text="${product.name}"></td>
        <td th:text="${product.price}"></td>
        <td>
            <a th:href="@{/products/view/{id}(id=${product.id})}" class="btn btn-info btn-sm">Voir</a>
            <a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-warning btn-sm">Modifier</a>
            <a th:href="@{/products/delete/{id}(id=${product.id})}" class="btn btn-danger btn-sm">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
