<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Détail du produit</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="~{navbar :: navbar}"></div>
<h1>Détail de l'article</h1>
<p><strong>ID :</strong> <span th:text="${article.id}"></span></p>
<p><strong>Titre :</strong> <span th:text="${article.title}"></span></p>
<p><strong>Contenu :</strong> <span th:text="${article.content}"></span></p>
<a href="/articles" class="btn btn-secondary mt-3">Retour à la liste</a>
</body>
</html>
