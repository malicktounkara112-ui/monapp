<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - MonApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div th:replace="~{navbar :: navbar}"></div>

<div class="container">
    <h1 class="mb-4">Dashboard</h1>

    <div class="row g-4 mb-5">
        <div class="col-md-4">
            <div class="card text-white bg-primary shadow">
                <div class="card-body text-center">
                    <h2 th:text="${totalProducts}">0</h2>
                    <p class="card-text">Produits</p>
                    <a href="/products" class="btn btn-light btn-sm">Voir</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success shadow">
                <div class="card-body text-center">
                    <h2 th:text="${totalArticles}">0</h2>
                    <p class="card-text">Articles</p>
                    <a href="/articles" class="btn btn-light btn-sm">Voir</a>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-warning shadow">
                <div class="card-body text-center">
                    <h2 th:text="${totalComments}">0</h2>
                    <p class="card-text">Commentaires</p>
                    <a href="/comments" class="btn btn-light btn-sm">Voir</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
