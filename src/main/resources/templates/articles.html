<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des articles</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="~{navbar :: navbar}"></div>
<h1 class="mb-4">Liste des articles</h1>

<h2>Ajouter un article</h2>
<form action="/articles/add" method="post" class="mb-4">
    <div class="mb-2">
        <input type="text" name="title" placeholder="Titre" required class="form-control"/>
    </div>
    <div class="mb-2">
        <input type="text" name="content" placeholder="Contenu" class="form-control"/>
    </div>
    <button type="submit" class="btn btn-primary">Ajouter</button>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Titre</th>
        <th>Contenu</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="article : ${articles}">
        <td th:text="${article.id}"></td>
        <td th:text="${article.title}"></td>
        <td th:text="${article.content}"></td>
        <td>
            <a th:href="@{/articles/view/{id}(id=${article.id})}" class="btn btn-info btn-sm">Voir</a>
            <a th:href="@{/articles/edit/{id}(id=${article.id})}" class="btn btn-warning btn-sm">Modifier</a>
            <a th:href="@{/articles/delete/{id}(id=${article.id})}" class="btn btn-danger btn-sm">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
