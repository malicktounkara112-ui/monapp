<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Liste des commentaires</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
<div th:replace="~{navbar :: navbar}"></div>
<h1 class="mb-4">Liste des commentaires</h1>

<h2>Ajouter un commentaire</h2>
<form action="/comments/add" method="post" class="mb-4">
    <div class="mb-2">
        <input type="text" name="text" placeholder="Text" required class="form-control"/>
    </div>
    <div class="mb-2">
        <input type="text" name="author" placeholder="Auteur" class="form-control"/>
    </div>
    <button type="submit" class="btn btn-primary">Ajouter</button>
</form>

<table class="table table-bordered table-hover">
    <thead class="table-dark">
    <tr>
        <th>ID</th>
        <th>Text</th>
        <th>Auteur</th>
        <th>Action</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="comment : ${comments}">
        <td th:text="${comment.id}"></td>
        <td th:text="${comment.text}"></td>
        <td th:text="${comment.author}"></td>
        <td>
            <a th:href="@{/comments/view/{id}(id=${comment.id})}" class="btn btn-info btn-sm">Voir</a>
            <a th:href="@{/comments/edit/{id}(id=${comment.id})}" class="btn btn-warning btn-sm">Modifier</a>
            <a th:href="@{/comments/delete/{id}(id=${comment.id})}" class="btn btn-danger btn-sm">Supprimer</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
</html>
